# PR がマージされたら、そのPRのブランチを自動で削除する
# （main と既定ブランチ、フォークからのPRのブランチは対象外）
name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git check-ref-format "refs/heads/${BRANCH}"
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid original head SHA"
            exit 1
          fi
          cleanup_dir=$(mktemp -d "${RUNNER_TEMP}/merged-branch.XXXXXX")
          git init --quiet "$cleanup_dir"
          cd "$cleanup_dir"
          git remote add origin "https://github.com/${REPO}.git"
          gh auth setup-git
          # ref名の再利用やチェック後の更新も、サーバー側のSHA照合で保護する。
          if git push --force-with-lease="refs/heads/${BRANCH}:${EXPECTED_SHA}" origin ":refs/heads/${BRANCH}"; then
            echo "Deleted the original merged branch"
          else
            echo "::warning::Branch was absent, changed, or could not be deleted; no unconditional deletion attempted"
          fi
