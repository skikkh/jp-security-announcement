# PR がマージされたら、そのPRのブランチを自動で削除する
# （main と既定ブランチ、フォークからのPRのブランチは対象外）
name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api -X DELETE "repos/${REPO}/git/refs/heads/${BRANCH}"; then
            echo "Deleted ${BRANCH}"
          else
            echo "Branch ${BRANCH} was already deleted or could not be deleted"
          fi
