name: Pages公開

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: サイト検証
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: jp-security-pages-build
      cancel-in-progress: true
    steps:
      - name: 原稿を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pythonを準備
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: データ・ビルド・配信ファイルの一致を確認
        run: |
          python3 tools/build.py
          python3 -I tools/test_contact_validation.py
          git diff --exit-code -- docs
          if [[ -n "$(git status --porcelain --untracked-files=all -- docs)" ]]; then
            echo "::error::配信ファイルに未追跡または未反映の差分があります"
            exit 1
          fi
          node --check src/assets/app.js
          python3 tools/check_site.py
      - name: 検証対象が現在のmainであることを確認
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          latest_sha="$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')"
          if [[ ! "$latest_sha" =~ ^[0-9a-f]{40}$ || "$latest_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::mainが更新されたため、この世代の公開を停止します"
            exit 1
          fi
      - name: 検証済みの配信ファイルを保存
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Pages公開
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: jp-security-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開直前に現在のmainを再確認
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          latest_sha="$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')"
          if [[ ! "$latest_sha" =~ ^[0-9a-f]{40}$ || "$latest_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::古い世代のartifactは公開しません"
            exit 1
          fi
      - name: 検証済みartifactをPagesへ公開
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: '300000'
