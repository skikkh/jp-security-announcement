<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { font-family: "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; background: #123b63; color: #fff; display: flex; }
  .l { flex: 1; padding: 64px 0 56px 72px; display: flex; flex-direction: column; }
  .tag { display: inline-block; align-self: flex-start; background: #b3261e; padding: 6px 16px; border-radius: 99px; font-size: 26px; font-weight: 700; letter-spacing: .06em; }
  h1 { font-size: 88px; margin: 22px 0 8px; letter-spacing: .04em; line-height: 1.15; }
  .sub { font-size: 31px; line-height: 1.5; color: #dbe7f3; margin: 0; }
  .rules { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .rules div { align-self: flex-start; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.25); border-radius: 12px; padding: 6px 18px; font-size: 27px; font-weight: 700; white-space: nowrap; }
  .r { width: 300px; display: grid; place-items: center; }
  .r svg { width: 230px; height: 230px; }
</style></head>
<body>
  <div class="l">
    <span class="tag">2026年10月 個人情報 大量漏えい</span>
    <h1>漏れた後の守り方</h1>
    <p class="sub">情報が漏れていても、被害は防げる。<br>いま一人ひとりができる対策を、効く順に。</p>
    <div class="rules"><div>1. 届いた連絡からは動かない</div><div>2. 「知っている」は本物の証拠ではない</div><div>3. 消すより、使えなくする</div></div>
  </div>

</body></html>
